# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'en-US'
reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: 'src/**'
      instructions: >
        This is a TypeScript ESM-only library. Enforce strict type safety (no `any`),
        early returns over nesting, single-purpose functions, no comments unless the
        WHY is non-obvious. Check that sync functions added to src/sync/ are covered
        by tests in tests/.
    - path: 'src/init/scaffold.ts'
      instructions: >
        Templates are inlined strings, not separate files. Any new scaffold function
        must be called from the main `scaffold()` function and must be guarded by
        its corresponding `answers.*` field.
    - path: 'tests/**'
      instructions: >
        Tests use Vitest. No mocking of the filesystem — tests write to a real tmp
        directory. Every new scaffold feature needs a describe block with both a
        positive (file exists + content check) and a negative (flag=false → no file)
        test case.
    - path: 'docs/wiki/**'
      instructions: >
        Docs must stay in parity with code. If a PR changes user-facing behavior
        (CLI flags, init wizard, sync output) without updating docs/wiki, flag it.
chat:
  auto_reply: true
