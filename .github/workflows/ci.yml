name: CI

on:
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # Dogfood: install this repo's own packs and re-sync. Generated output is gitignored except
      # .claude/settings.json, so drift shows up there or in the lockfile.
      - name: Dogfood install + sync
        run: |
          node bin/cli.js install
          node bin/cli.js sync
          git diff --exit-code -- .claude/settings.json llm/packages-lock.json

      - name: Test
        run: npm test

      - name: Check overlays
        run: npm run check:overlays

      # Release PRs only: a stale snapshot ships init defaults from an old catalog. Gating every
      # PR would fail unrelated work whenever packs main moves.
      - name: Check catalog snapshot is current
        if: startsWith(github.head_ref, 'release-please--')
        run: npm run check:catalog
