name: Commitlint

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  # pull_request_target fires for bot-created PRs (e.g. release-please) where
  # pull_request does not. PR title comes from the event payload, not the
  # checked-out code, so this is safe to use here.
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint
