name: E2E

# Runs the full documented happy path against the live npm registry.
# A failure here means the published CLI + published packs are broken for real users.

on:
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  e2e:
    name: init + install + sync (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [frontend, backend, fullstack, devops]

    steps:
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Create temp project dir
        run: mkdir /tmp/e2e-project

      - name: Run bluetemberg init
        working-directory: /tmp/e2e-project
        run: |
          npx --yes bluetemberg@latest init \
            --non-interactive \
            --profile ${{ matrix.profile }} \
            --silent

      - name: Verify init output
        working-directory: /tmp/e2e-project
        run: |
          test -f bluetemberg.config.json || (echo "missing bluetemberg.config.json" && exit 1)
          test -f llm/packages.json       || (echo "missing llm/packages.json" && exit 1)
          echo "Init output verified"

      - name: Run bluetemberg install
        working-directory: /tmp/e2e-project
        run: npx bluetemberg@latest install

      - name: Verify install output
        working-directory: /tmp/e2e-project
        run: |
          test -f llm/packages-lock.json || (echo "missing llm/packages-lock.json" && exit 1)
          PACK_COUNT=$(( $(find .bluetemberg/packs -mindepth 2 -maxdepth 2 -type d | wc -l) + $(find .bluetemberg/packs -mindepth 3 -maxdepth 3 -type d | wc -l) ))
          echo "Installed pack directories: $PACK_COUNT"
          test "$PACK_COUNT" -gt 0 || (echo "no packs installed in .bluetemberg/packs/" && exit 1)

      - name: Run bluetemberg sync
        working-directory: /tmp/e2e-project
        run: npx bluetemberg@latest sync

      - name: Verify sync output
        working-directory: /tmp/e2e-project
        run: |
          test -d .claude/rules || (echo "missing .claude/rules/" && exit 1)
          RULE_COUNT=$(find .claude/rules -name "*.md" | wc -l)
          echo "Synced rules: $RULE_COUNT"
          test "$RULE_COUNT" -gt 0 || (echo "no rules synced to .claude/rules/" && exit 1)
          echo "Sync output verified"

  # A red nightly run that nobody opens is the same as no test. Keep one open issue while the
  # published CLI + packs are broken, comment on it each night, and close it when the run goes green.
  report:
    name: report result
    needs: e2e
    if: ${{ always() && github.event_name == 'schedule' && (needs.e2e.result == 'success' || needs.e2e.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.e2e.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LABEL: e2e-failure
    steps:
      - name: Open, update, or close the tracking issue
        run: |
          set -euo pipefail

          gh label create "$LABEL" --color B60205 \
            --description "Nightly E2E against live npm is failing" 2>/dev/null || true

          OPEN=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')

          if [ "$RESULT" = "success" ]; then
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --body "Green again: $RUN_URL"
              gh issue close "$OPEN" --reason completed
            fi
            exit 0
          fi

          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Still failing: $RUN_URL"
            exit 0
          fi

          gh issue create --label "$LABEL" \
            --title "E2E failing: a new user's init + install + sync is broken" \
            --body "The nightly E2E ran the documented path against the live npm registry (published CLI and published packs) and it failed.

          Run: $RUN_URL

          The failing step is named in each profile's job log. This issue stays open while the run is red, gets a comment each night, and closes itself on the first green run."
